[project]
name = "services-domain-denylist"
version = "1.0.0"
description = "Convert AdGuard Home blocked-services rules into a plain-domain blocklist"
license = {text = "MIT"}
authors = [{name = "Andreas Schmid", email = "service@aaschmid.de"}]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "Q"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
